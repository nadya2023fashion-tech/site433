<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/sonic.css">
    <script src="../js/sonic.js"></script>
</head>

<body>

    <img src="../img/8490f0cab98f44a6e905a72cb61b72aa.gif" alt="font_sonic" class="sonic" id="main-sonic">

    <img src="../img/8490f0cab98f44a6e905a72cb61b72aa.gif" alt="sonic_mushrooms" class="sonic_mushrooms"
        id="sonic_mushrooms" onclick="runExistingSonic()">


    <div class="eggman">
        <img src="../img/Eggman-PNG-Picture.png" alt="эггман">
    </div>


    <div class="arrow">
        <img src="../img/arrow.png" alt="arrow" onclick="runExistingSonic()">
    </div>

    <div class="mushrooms">
        <img src="../img/mashrooms.png" alt="грибы" onclick="runExistingSonic()">
    </div>


    <center>



        <div class="header">
            <!-- Добавили класс sonic-container и тег span внутрь текста -->
            <p class="sonic-container" onclick="playRutubeVideos()">
                sonic
                <span class="yellow-tooltip">Смотреть ролики</span>
            </p>
        </div>


        <div class="content">
            <div class="container1">
                <img src="../img/img1.jpg" alt="sonic">
            </div>
            <div class="container2">
                <img src="../img/img2.jpg" alt="sonic">
            </div>
            <div class="container3">
                <img src="../img/img3.jpg" alt="sonic">
            </div>
            <div class="container4">
                <img src="../img/img4.jpg" alt="sonic">
            </div>
        </div>

        <div class="content2">
            <div>
                <iframe width="720" height="405" src="https://rutube.ru/play/embed/9edf2fc2c91f74527a89144521e3e1af/"
                    style="border: none;" allow="clipboard-write; autoplay" allowFullScreen></iframe>
            </div>
            <div>
                <iframe width="720" height="405" src="https://rutube.ru/play/embed/3955ded3e2e66bc4d89d27ab61867297/"
                    style="border: none;" allow="clipboard-write; autoplay" allowFullScreen></iframe>
            </div>


        </div>

        <div class="footer">
            <h1>2026</h1>
        </div>
        <a href="../index.html">Марио</a>
    </center>
</body>
